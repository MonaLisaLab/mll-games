<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>タイミング斬り</title>
    <style>
      :root{
        --indigo:#0c1129;
        --indigo2:#131b3d;
        --gold:#e9bc45;
        --gold-bright:#ffd968;
        --shu:#e0472f;
        --paper:#f4ecd9;
        --paper-dim:#b9b29c;
        --line:rgba(233,188,69,.35);
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0; background:var(--indigo); color:var(--paper);
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
        overflow:hidden; overscroll-behavior:none;
      }
      button{ min-height:2.25rem; font-family:inherit; cursor:pointer; }
      #app{
        position:fixed; inset:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
        background:
          radial-gradient(120% 90% at 50% 0%, #1a2450 0%, var(--indigo2) 42%, var(--indigo) 78%);
      }
      canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }

      /* ---------- HUD ---------- */
      #hud{
        position:absolute; top:0; left:0; right:0; z-index:5;
        padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
        display:none; pointer-events:none;
      }
      #hud.on{ display:block; }
      .hud-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
      .hud-left,.hud-right{ display:flex; flex-direction:column; gap:2px; }
      .hud-right{ align-items:flex-end; text-align:right; }
      .hud-label{ font-size:11px; letter-spacing:.18em; color:var(--paper-dim); }
      #hud-score{ font-size:clamp(26px,6vw,40px); font-weight:800; line-height:1; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.55); font-variant-numeric:tabular-nums; }
      #hud-best{ font-size:12px; color:var(--paper-dim); font-variant-numeric:tabular-nums; }
      #hud-lives{ font-size:clamp(18px,4.5vw,24px); letter-spacing:.12em; line-height:1.1; }
      #hud-lives .heart{ color:var(--shu); text-shadow:0 0 10px rgba(224,71,47,.6); }
      #hud-lives .heart.off{ color:rgba(244,236,217,.18); text-shadow:none; }
      #hud-level{ font-size:13px; color:var(--gold-bright); font-weight:700; letter-spacing:.08em; }
      #hud-next{ font-size:12px; color:var(--paper-dim); font-variant-numeric:tabular-nums; }
      #hud-next b{ color:var(--gold-bright); }
      #hud-combo{
        position:absolute; left:50%; top:16%; transform:translateX(-50%);
        text-align:center; opacity:0; transition:opacity .15s;
      }
      #hud-combo.on{ opacity:1; }
      #hud-combo .num{
        font-size:clamp(34px,9vw,58px); font-weight:900; line-height:1; color:var(--gold-bright);
        text-shadow:0 0 22px rgba(233,188,69,.55), 0 3px 0 rgba(0,0,0,.35);
        font-variant-numeric:tabular-nums;
      }
      #hud-combo .lbl{ font-size:12px; letter-spacing:.3em; color:var(--paper); }
      #hud-combo .mult{ font-size:14px; font-weight:800; color:#fff; margin-top:2px; }
      #hud-combo.pop .num{ animation:comboPop .18s ease-out; }
      @keyframes comboPop{ 0%{ transform:scale(1.35);} 100%{ transform:scale(1);} }

      /* ---------- corner buttons ---------- */
      .corner-btns{
        position:absolute; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); z-index:8;
        display:flex; gap:8px;
      }
      .icon-btn{
        width:44px; height:44px; min-height:44px; border-radius:50%;
        border:1px solid var(--line); background:rgba(10,14,34,.72); color:var(--paper);
        font-size:19px; display:flex; align-items:center; justify-content:center; padding:0;
        backdrop-filter:blur(4px);
      }
      .icon-btn:active{ transform:scale(.94); }
      #toplink{
        position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:8;
        color:var(--paper-dim); font-size:12px; text-decoration:none;
        padding:10px 6px; letter-spacing:.06em;
      }
      #toplink:hover{ color:var(--gold-bright); }

      #tap-hint{
        position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 64px); transform:translateX(-50%);
        z-index:4; font-size:12px; letter-spacing:.24em; color:rgba(244,236,217,.5);
        display:none; pointer-events:none; white-space:nowrap;
      }
      #tap-hint.on{ display:block; animation:hintPulse 1.6s ease-in-out infinite; }
      @keyframes hintPulse{ 0%,100%{ opacity:.45;} 50%{ opacity:1;} }

      /* ---------- announcement banner ---------- */
      #banner{
        position:absolute; left:0; right:0; top:30%; z-index:6; text-align:center; pointer-events:none;
        opacity:0;
      }
      #banner.show{ animation:bannerIn 1.6s ease-out forwards; }
      #banner .big{
        font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700;
        font-size:clamp(30px,8vw,54px); letter-spacing:.22em; color:var(--gold-bright);
        text-shadow:0 0 30px rgba(233,188,69,.5), 0 3px 0 rgba(0,0,0,.4);
      }
      #banner .sub{ font-size:clamp(13px,3.4vw,17px); letter-spacing:.2em; color:var(--paper); margin-top:6px; }
      #banner.danger .big{ color:#ff6a55; text-shadow:0 0 30px rgba(224,71,47,.6), 0 3px 0 rgba(0,0,0,.4); }
      @keyframes bannerIn{
        0%{ opacity:0; transform:scale(1.25); }
        12%{ opacity:1; transform:scale(1); }
        78%{ opacity:1; }
        100%{ opacity:0; transform:scale(.98); }
      }

      /* ---------- toast ---------- */
      #toast{
        position:absolute; left:50%; bottom:22%; transform:translateX(-50%) translateY(16px); z-index:9;
        background:rgba(12,17,41,.92); border:1px solid var(--gold); color:var(--gold-bright);
        padding:10px 20px; border-radius:999px; font-size:14px; font-weight:700; letter-spacing:.08em;
        opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap;
        box-shadow:0 8px 30px rgba(0,0,0,.5);
      }
      #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

      /* ---------- overlays ---------- */
      .overlay{
        position:absolute; inset:0; z-index:10; display:none;
        align-items:center; justify-content:center; padding:18px;
        background:radial-gradient(90% 70% at 50% 38%, rgba(19,27,61,.55), rgba(7,10,24,.88));
        overflow-y:auto;
      }
      .overlay.on{ display:flex; }
      .panel{ width:min(560px,100%); text-align:center; margin:auto; padding:10px 0 6px; }
      .title-jp{
        font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700;
        font-size:clamp(40px,10.5vw,72px); letter-spacing:.12em; line-height:1.15; color:#fff;
        white-space:nowrap;
        text-shadow:0 0 34px rgba(233,188,69,.35), 0 4px 0 rgba(0,0,0,.45);
      }
      .title-jp .accent{ color:var(--shu); }
      .title-rule{
        width:min(300px,70%); height:2px; margin:14px auto 10px;
        background:linear-gradient(90deg, transparent, var(--gold), transparent);
      }
      .tagline{ font-size:clamp(13px,3.6vw,16px); color:var(--paper); letter-spacing:.1em; line-height:1.9; }
      .tagline b{ color:var(--gold-bright); }
      .howto{ font-size:12.5px; color:var(--paper-dim); letter-spacing:.06em; line-height:1.8; margin-top:4px; }

      .btn-main{
        display:inline-block; margin-top:22px; padding:15px 52px; border:none; border-radius:6px;
        background:linear-gradient(180deg, #f0644a, var(--shu) 55%, #b62f1e);
        color:#fff; font-size:20px; font-weight:800; letter-spacing:.3em; text-indent:.3em;
        box-shadow:0 10px 26px rgba(224,71,47,.4), inset 0 1px 0 rgba(255,255,255,.35);
        transition:transform .08s;
      }
      .btn-main:active{ transform:scale(.96); }
      .btn-sub{
        display:inline-block; margin-top:12px; padding:10px 26px; border-radius:6px;
        background:transparent; border:1px solid var(--line); color:var(--paper);
        font-size:14px; letter-spacing:.14em;
      }
      .btn-sub:active{ transform:scale(.96); }
      .start-best{ margin-top:16px; font-size:13px; color:var(--paper-dim); letter-spacing:.1em; }
      .start-best b{ color:var(--gold-bright); font-size:16px; }

      /* sword select */
      .sect-title{ margin:26px 0 10px; font-size:12px; letter-spacing:.3em; color:var(--paper-dim); }
      #sword-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
      .sword-chip{
        border:1px solid rgba(244,236,217,.22); background:rgba(255,255,255,.04); color:var(--paper);
        border-radius:8px; padding:9px 12px; min-width:96px; text-align:center;
      }
      .sword-chip .sw{ display:block; height:6px; border-radius:3px; margin-bottom:7px; }
      .sword-chip .nm{ font-size:14px; font-weight:700; letter-spacing:.06em; }
      .sword-chip .req{ display:block; font-size:10.5px; color:var(--paper-dim); margin-top:2px; }
      .sword-chip.sel{ border-color:var(--gold); background:rgba(233,188,69,.12); box-shadow:0 0 0 1px var(--gold) inset; }
      .sword-chip.locked{ opacity:.45; }
      .sword-chip:not(.locked):active{ transform:scale(.96); }

      /* missions */
      details.missions{
        margin:22px auto 0; width:min(440px,100%); text-align:left;
        border:1px solid rgba(244,236,217,.16); border-radius:10px; background:rgba(255,255,255,.03);
      }
      details.missions summary{
        padding:12px 16px; font-size:14px; letter-spacing:.14em; color:var(--paper);
        list-style:none; display:flex; justify-content:space-between; align-items:center; min-height:44px;
      }
      details.missions summary::-webkit-details-marker{ display:none; }
      details.missions summary .cnt{ color:var(--gold-bright); font-size:12.5px; }
      details.missions ul{ margin:0; padding:2px 16px 14px; list-style:none; }
      details.missions li{
        padding:7px 0 7px 26px; position:relative; font-size:13.5px; color:var(--paper-dim);
        border-top:1px solid rgba(244,236,217,.07);
      }
      details.missions li::before{
        content:""; position:absolute; left:2px; top:9px; width:14px; height:14px; border-radius:3px;
        border:1.5px solid rgba(244,236,217,.35);
      }
      details.missions li.done{ color:var(--paper); }
      details.missions li.done::before{
        content:"✓"; border-color:var(--gold); background:var(--gold); color:#231a02;
        font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; line-height:1;
      }
      details.missions li .prog{ float:right; font-size:12px; color:var(--paper-dim); font-variant-numeric:tabular-nums; }

      /* game over */
      .over-title{
        font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700;
        font-size:clamp(34px,9vw,54px); letter-spacing:.2em; color:#fff;
        text-shadow:0 0 26px rgba(224,71,47,.45);
      }
      #over-rank{
        font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
        font-size:clamp(56px,15vw,92px); font-weight:700; line-height:1.1; color:var(--gold-bright);
        text-shadow:0 0 34px rgba(233,188,69,.55);
      }
      .rank-lbl{ font-size:11px; letter-spacing:.4em; color:var(--paper-dim); }
      #over-score{ font-size:clamp(30px,8vw,44px); font-weight:800; color:#fff; margin-top:6px; font-variant-numeric:tabular-nums; }
      #over-newbest{ color:var(--gold-bright); font-weight:800; letter-spacing:.2em; font-size:14px; min-height:20px; }
      .over-stats{
        display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px auto 0;
        max-width:400px;
      }
      .over-stats .stat{
        border:1px solid rgba(244,236,217,.15); border-radius:8px; padding:8px 14px; min-width:92px;
        background:rgba(255,255,255,.03); flex:1 1 40%;
      }
      .over-stats .stat .v{ font-size:19px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
      .over-stats .stat .k{ font-size:10.5px; color:var(--paper-dim); letter-spacing:.14em; margin-top:2px; }
      .pause-title{
        font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:clamp(28px,7vw,40px);
        letter-spacing:.3em; color:#fff; font-weight:700;
      }
      .btn-stack{ display:flex; flex-direction:column; align-items:center; gap:4px; }
      @media (prefers-reduced-motion: reduce){
        #banner.show{ animation-duration:.4s; }
        #tap-hint.on{ animation:none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud">
        <div class="hud-row">
          <div class="hud-left">
            <div class="hud-label">スコア</div>
            <div id="hud-score">0</div>
            <div id="hud-best">ベスト 0</div>
          </div>
          <div class="hud-right">
            <div id="hud-lives"></div>
            <div id="hud-level">レベル 1</div>
            <div id="hud-next"></div>
          </div>
        </div>
        <div id="hud-combo">
          <div class="num">0</div>
          <div class="lbl">コンボ</div>
          <div class="mult"></div>
        </div>
      </div>

      <div id="tap-hint">画面をタップして斬る！</div>
      <div id="banner"><div class="big"></div><div class="sub"></div></div>
      <div id="toast"></div>

      <a id="toplink" href="../index.html">← トップへ戻る</a>
      <div class="corner-btns">
        <button class="icon-btn" id="btn-pause" aria-label="ポーズ" title="ポーズ (P)">⏸</button>
        <button class="icon-btn" id="btn-mute" aria-label="サウンド切替" title="サウンド切替">🔊</button>
      </div>

      <!-- スタート画面 -->
      <div class="overlay on" id="ov-start">
        <div class="panel">
          <div class="title-jp">タイミング<span class="accent">斬り</span></div>
          <div class="title-rule"></div>
          <p class="tagline">往復する刃を、<b>金ゾーン</b>で止めろ。<br />狙うほど旨く、外すほど痛い。</p>
          <p class="howto">タップ／クリック／スペースキーで斬る。中央の金が300点、赤が100点、青が30点。</p>
          <button class="btn-main" id="btn-start">斬り始める</button>
          <div class="start-best" id="start-best"></div>

          <div class="sect-title">― 刀を選ぶ ―</div>
          <div id="sword-row"></div>

          <details class="missions" id="missions-box">
            <summary>ミッション <span class="cnt" id="missions-cnt"></span></summary>
            <ul id="missions-list"></ul>
          </details>
        </div>
      </div>

      <!-- ゲームオーバー画面 -->
      <div class="overlay" id="ov-over">
        <div class="panel">
          <div class="over-title">終 之 斬</div>
          <div class="rank-lbl" style="margin-top:14px;">評価</div>
          <div id="over-rank">C</div>
          <div id="over-newbest"></div>
          <div id="over-score">0</div>
          <div class="over-stats">
            <div class="stat"><div class="v" id="st-combo">0</div><div class="k">最大コンボ</div></div>
            <div class="stat"><div class="v" id="st-gold">0</div><div class="k">金ゾーン</div></div>
            <div class="stat"><div class="v" id="st-level">1</div><div class="k">到達レベル</div></div>
            <div class="stat"><div class="v" id="st-best">0</div><div class="k">ベスト</div></div>
          </div>
          <div class="btn-stack">
            <button class="btn-main" id="btn-retry">もう一度</button>
            <button class="btn-sub" id="btn-tomenu">メニューに戻る</button>
          </div>
          <p class="howto">Rキー／タップでも再戦できます</p>
        </div>
      </div>

      <!-- ポーズ画面 -->
      <div class="overlay" id="ov-pause">
        <div class="panel">
          <div class="pause-title">一時停止</div>
          <div class="btn-stack">
            <button class="btn-main" id="btn-resume">再開する</button>
            <button class="btn-sub" id="btn-restart2">最初から</button>
            <button class="btn-sub" id="btn-quit2">メニューに戻る</button>
          </div>
          <p class="howto">Pキーでも再開できます</p>
        </div>
      </div>
    </div>

    <script>
    "use strict";
    /* ============================================================
       タイミング斬り — timing action game
       ============================================================ */
    var $ = function(id){ return document.getElementById(id); };
    var canvas = $("game"), ctx = canvas.getContext("2d");
    var W = 0, H = 0, DPR = 1;

    function resize(){
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    /* ---------------- 保存データ ---------------- */
    var SAVE_KEY = "timing-zan-save-v1";
    var save = {
      best: 0, total: 0, unlocked: 1, sword: 0, muted: false,
      missions: {}, stats: { gold: 0, maxCombo: 0, maxLevel: 0 }
    };
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === "object") {
          save.best = p.best|0; save.total = p.total|0;
          save.unlocked = Math.max(1, Math.min(5, p.unlocked|0 || 1));
          save.sword = Math.max(0, Math.min(4, p.sword|0));
          save.muted = !!p.muted;
          save.missions = p.missions || {};
          if (p.stats) {
            save.stats.gold = p.stats.gold|0;
            save.stats.maxCombo = p.stats.maxCombo|0;
            save.stats.maxLevel = p.stats.maxLevel|0;
          }
        }
      }
    } catch (e) {}
    function persist(){
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
    }

    /* ---------------- 刀 ---------------- */
    var SWORDS = [
      { name: "木刀",     req: 0,    color: "#b98046", glow: "rgba(185,128,70,.55)",  trail: "rgba(185,128,70," },
      { name: "鉄刀",     req: 500,  color: "#c8ccd4", glow: "rgba(200,204,212,.6)",  trail: "rgba(200,204,212," },
      { name: "鋼の刀",   req: 1500, color: "#7fb2e8", glow: "rgba(127,178,232,.65)", trail: "rgba(127,178,232," },
      { name: "名刀",     req: 3000, color: "#e0472f", glow: "rgba(224,71,47,.65)",   trail: "rgba(224,71,47," },
      { name: "伝説の刀", req: 6000, color: "#ffd968", glow: "rgba(255,217,104,.8)",  trail: "rgba(255,217,104," }
    ];

    /* ---------------- ミッション ---------------- */
    var MISSIONS = [
      { id: "gold10",   text: "金ゾーンを合計10回斬る",   prog: function(){ return [save.stats.gold, 10]; } },
      { id: "combo15",  text: "コンボ15を達成する",       prog: function(){ return [save.stats.maxCombo, 15]; } },
      { id: "level5",   text: "レベル5に到達する",        prog: function(){ return [save.stats.maxLevel, 5]; } },
      { id: "score2000",text: "1ゲームで2000点取る",      prog: function(){ return [save.best, 2000]; } },
      { id: "gold30",   text: "金ゾーンを合計30回斬る",   prog: function(){ return [save.stats.gold, 30]; } },
      { id: "combo25",  text: "コンボ25を達成する",       prog: function(){ return [save.stats.maxCombo, 25]; } },
      { id: "level10",  text: "レベル10に到達する",       prog: function(){ return [save.stats.maxLevel, 10]; } },
      { id: "score4000",text: "1ゲームで4000点取る",      prog: function(){ return [save.best, 4000]; } },
      { id: "legend",   text: "伝説の刀を解放する",       prog: function(){ return [save.unlocked >= 5 ? 1 : 0, 1]; } }
    ];
    function checkMissions(announce){
      var newly = [];
      for (var i = 0; i < MISSIONS.length; i++) {
        var m = MISSIONS[i];
        if (save.missions[m.id]) continue;
        var pr = m.prog();
        if (pr[0] >= pr[1]) { save.missions[m.id] = true; newly.push(m); }
      }
      if (newly.length) {
        persist();
        if (announce) showToast("ミッション達成！「" + newly[0].text + "」");
      }
      return newly.length > 0;
    }

    /* ---------------- オーディオ ---------------- */
    var AC = null, masterGain = null, bgmGain = null, noiseBuf = null;
    var muted = save.muted;
    function audioInit(){
      if (AC) { if (AC.state === "suspended") AC.resume(); return; }
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = AC.createGain(); masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(AC.destination);
        bgmGain = AC.createGain(); bgmGain.gain.value = 0.16; bgmGain.connect(masterGain);
        var len = AC.sampleRate * 1;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        bgmStart();
      } catch (e) { AC = null; }
    }
    function tone(freq, dur, type, vol, when, slideTo, dest){
      if (!AC) return;
      var t = AC.currentTime + (when || 0);
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.008);

    /* BGM: 軽快な和風ペンタトニック・ループ */
    var bgmTimer = null, bgmStep = 0, bgmNext = 0;

    /* ---------------- 描画 ---------------- */
    function draw(g, mx, my){
      ctx.save();

        ctx.rotate(-0.5);
        var len = (s.gold ? 190 : 140) * (0.5 + pr * 0.9);
        var grad = ctx.createLinearGradient(-len, 0, len, 0);
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(0.5, "#ffffff");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(-len, -2.2, len * 2, 4.4);

      ctx.lineWidth = 1.5;
      roundRect(g.x - 6, g.y - 6, g.w + 12, g.h + 12, 14); ctx.stroke();
      /* 青 */
      var b = zoneRect(g, BLUE_HALF);
      ctx.fillStyle = "#2c4f96"; roundRect(b.x, g.y, b.w, g.h, 8); ctx.fill();
      /* 赤 */
      var rd = zoneRect(g, RED_HALF);
      ctx.fillStyle = "#b3341f"; roundRect(rd.x, g.y, rd.w, g.h, 6); ctx.fill();
      /* 金 */
      var gd = zoneRect(g, GOLD_HALF);
      var gg = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
      gg.addColorStop(0, "#ffe98a"); gg.addColorStop(0.5, "#e9bc45"); gg.addColorStop(1, "#b8860b");
      ctx.fillStyle = gg; roundRect(gd.x, g.y, gd.w, g.h, 4); ctx.fill();
      /* ゾーンの点数ラベル */
      ctx.textAlign = "center";
      ctx.font = "700 12px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillText("30", g.x + (0.5 - (BLUE_HALF + RED_HALF) / 2) * g.w, g.y + g.h + 22);
      ctx.fillText("30", g.x + (0.5 + (BLUE_HALF + RED_HALF) / 2) * g.w, g.y + g.h + 22);
      ctx.fillStyle = "#ffb59d";
      ctx.fillText("100", g.x + (0.5 - (RED_HALF + GOLD_HALF) / 2) * g.w, g.y + g.h + 22);
      ctx.fillText("100", g.x + (0.5 + (RED_HALF + GOLD_HALF) / 2) * g.w, g.y + g.h + 22);
      ctx.fillStyle = "#ffd968";
      ctx.fillText("300", g.x + 0.5 * g.w, g.y + g.h + 22);
      /* 中央ライン */
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.fillRect(g.x + 0.5 * g.w - 0.75, g.y - 10, 1.5, 8);
    }
    function drawTrail(){
      var sw = SWORDS[save.sword];
      for (var i = 1; i < trail.length; i++) {
        var a = i / trail.length;
        ctx.strokeStyle = sw.trail + (a * 0.4) + ")";
        ctx.lineWidth = 2 + a * 5;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
    }
    function drawMarker(g, mx, my){
      var sw = SWORDS[save.sword];
      var bh = g.h * 1.9;
      ctx.save();
      ctx.shadowColor = sw.glow; ctx.shadowBlur = 18;
      var grad = ctx.createLinearGradient(0, my - bh / 2, 0, my + bh / 2);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.45, sw.color);
      grad.addColorStop(1, sw.color);
      ctx.fillStyle = grad;
      /* 刃（細長い菱形） */
      ctx.beginPath();
      ctx.moveTo(mx, my - bh / 2);
      ctx.lineTo(mx + 4.5, my);
      ctx.lineTo(mx, my + bh / 2);
      ctx.lineTo(mx - 4.5, my);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      /* 鍔 */
      ctx.fillStyle = "#2a2118";
      ctx.fillRect(mx - 9, my + bh * 0.18, 18, 4);
    }
    function roundRect(x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    /* ---------------- 入力 ---------------- */
    var app = $("app");
    app.addEventListener("pointerdown", function(e){
      if (e.target.closest("button, a, details, .overlay")) return;
      if (state === "playing") slash();
      else if (state === "over" && !$("ov-over").classList.contains("on")) slash();
    });
    /* ゲームオーバー画面が出たあとのタップ再戦（少し遅延して誤爆防止） */
    var overShownAt = 0;
    var overObserver = new MutationObserver(function(){
      if ($("ov-over").classList.contains("on")) overShownAt = performance.now();
    });
    overObserver.observe($("ov-over"), { attributes: true, attributeFilter: ["class"] });
    $("ov-over").addEventListener("pointerdown", function(e){
      if (e.target.closest("button")) return;
      if (performance.now() - overShownAt > 600) startGame();
    });

    document.addEventListener("keydown", function(e){
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (e.repeat) return;
        if (state === "playing") slash();
        else if (state === "menu") startGame();
        else if (state === "over" && $("ov-over").classList.contains("on")) startGame();
        else if (state === "paused") setPause(false);
      } else if (e.code === "KeyP" || e.code === "Escape") {
        if (state === "playing") setPause(true);
        else if (state === "paused") setPause(false);
      } else if (e.code === "KeyR") {
        if (state === "over" || state === "paused" || state === "playing") startGame();
      }
    });
    document.addEventListener("visibilitychange", function(){
      if (document.hidden && state === "playing") setPause(true);
    });

    $("btn-start").addEventListener("click", startGame);
    $("btn-retry").addEventListener("click", startGame);
    $("btn-tomenu").addEventListener("click", toMenu);
    $("btn-pause").addEventListener("click", function(){
      if (state === "playing") setPause(true);
      else if (state === "paused") setPause(false);
    });
    $("btn-resume").addEventListener("click", function(){ setPause(false); });
    $("btn-restart2").addEventListener("click", startGame);
    $("btn-quit2").addEventListener("click", toMenu);
    $("btn-mute").addEventListener("click", function(){ audioInit(); setMuted(!muted); });
    $("toplink").addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    $("btn-mute").textContent = muted ? "🔇" : "🔊";

    checkMissions(false);
    renderMenu();
    requestAnimationFrame(update);
    </script>
  </body>
</html>
